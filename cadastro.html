
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo | Criar conta</title>
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>

    <main class="tela-cadastro">

        <!-- Formas decorativas -->
        <div class="forma forma-superior"></div>
        <div class="forma forma-esquerda"></div>
        <div class="forma forma-dourada"></div>
        <div class="forma forma-coral"></div>

        <section class="conteudo-cadastro">

            <a href="login.html" class="voltar" aria-label="Voltar para login">
                ← Voltar
            </a>

            <header class="cabecalho">
                <img src="img/logo-nexo.png"
                     alt="Logo do Nexo"
                     class="logo">

                <h1>Criar conta</h1>
                <p>Comece sua jornada de conquistas em família.</p>
            </header>

            <form id="form-cadastro" class="form-cadastro">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="usuario">Nome de usuário</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Escolha um nome de usuário"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>

                    <div class="campo-senha">
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Crie uma senha"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="mostrar-senha"
                            data-alvo="senha"
                            aria-label="Mostrar senha"
                        >
                            Mostrar
                        </button>
                    </div>
                </div>

                <div class="campo">
                    <label for="confirmar-senha">Confirmar senha</label>

                    <div class="campo-senha">
                        <input
                            type="password"
                            id="confirmar-senha"
                            name="confirmar-senha"
                            placeholder="Digite sua senha novamente"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="mostrar-senha"
                            data-alvo="confirmar-senha"
                            aria-label="Mostrar confirmação de senha"
                        >
                            Mostrar
                        </button>
                    </div>
                </div>

                <p class="aviso-senha">
                    A senha deve conter pelo menos 8 caracteres.
                </p>

                <p id="mensagem-cadastro"
                   class="mensagem-cadastro"
                   role="status"
                   aria-live="polite"></p>

                <button type="submit" class="botao-cadastrar">
                    Criar minha conta
                </button>

            </form>

            <footer class="rodape">
                <p>Já tem uma conta?
                    <a href="login.html">Entrar</a>
                </p>
            </footer>

        </section>
    </main>

    <script src="js/cadastro.js"></script>
</body>
</html>
