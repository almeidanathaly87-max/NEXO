
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexo | Início</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="tela-inicial">

        <!-- Quatro formas decorativas -->

        <svg class="forma forma-superior" viewBox="0 0 240 180"
             preserveAspectRatio="none" aria-hidden="true">
            <defs>
                <linearGradient id="gradiente-superior"
                                x1="0%" y1="0%"
                                x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FFAD24"/>
                    <stop offset="100%" stop-color="#FA526D"/>
                </linearGradient>
            </defs>

            <path
                d="M 75 0
                   H 240
                   V 180
                   C 183 170, 153 143, 143 100
                   C 133 55, 104 20, 75 0 Z"
                fill="url(#gradiente-superior)"
            />
        </svg>

        <svg class="forma forma-esquerda" viewBox="0 0 220 210"
             preserveAspectRatio="none" aria-hidden="true">
            <path
                d="M 0 0
                   C 65 12, 118 50, 156 98
                   C 190 140, 208 182, 220 210
                   H 0 Z"
                fill="#6C3FF2"
            />
        </svg>

        <svg class="forma forma-dourada" viewBox="0 0 230 140"
             preserveAspectRatio="none" aria-hidden="true">
            <path
                d="M 0 140
                   C 27 77, 65 29, 113 17
                   C 164 4, 207 59, 230 140 Z"
                fill="#FFAD24"
            />
        </svg>

        <svg class="forma forma-coral" viewBox="0 0 180 140"
             preserveAspectRatio="none" aria-hidden="true">
            <path
                d="M 0 140
                   C 22 86, 59 47, 106 24
                   C 139 8, 163 4, 180 0
                   V 140 Z"
                fill="#FA526D"
            />
        </svg>

        <!-- Conteúdo central -->

        <section class="conteudo">

            <div class="marca">

                <img
                    src="img/logo-nexo.png"
                    alt="Logo do Nexo"
                    class="logo"
                >

                <h1 class="nome">nexo</h1>

                <p class="slogan">
                    Conectando conquistas.<br>
                    Fortalecendo laços.
                </p>

            </div>

            <div class="acoes">

                <button
                    id="botao-comecar"
                    class="botao-comecar"
                    type="button"
                >
                    Começar
                    <span class="seta" aria-hidden="true">→</span>
                </button>

            </div>

        </section>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
