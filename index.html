<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nexo</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="tela-inicial">

        <!-- Decorações do fundo -->

        <div class="circulo circulo-1"></div>
        <div class="circulo circulo-2"></div>
        <div class="circulo circulo-3"></div>


        <!-- Conteúdo principal -->

        <section class="conteudo">

            <div class="marca">

                <img
                    src="imagem/logo-nexo.png"
                    alt="Logo do Nexo"
                    class="logo"
                >

                <h1 class="nome">
                    nexo
                </h1>

                <p class="slogan">
                    Conectado conquistas.<br>
                    Fortalecendo laços.
                </p>

            </div>


            <div class="acoes">

                <button
                    id="botao-comecar"
                    class="botao-comecar"
                    type="button"
                >
                    Começar

                    <span class="seta">
                        →
                    </span>
                </button>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
