
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nexo</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="tela-inicial">

        <!-- Quatro elementos decorativos do fundo -->
        <div class="circulo circulo-1"></div>
        <div class="circulo circulo-2"></div>
        <div class="circulo circulo-3"></div>
        <div class="circulo circulo-4"></div>

        <!-- Conteúdo da tela inicial -->
        <section class="conteudo">

            <!-- Logo e identidade -->
            <div class="marca">

                <img
                    src="img/logo-nexo.png"
                    alt="Logo do Nexo"
                    class="logo"
                >

                <h1 class="nome">nexo</h1>

                <p class="slogan">
                    Conectando conquistas.<br>
                    Fortalecendo laços.
                </p>

            </div>

            <!-- Botão de navegação -->
            <div class="acoes">

                <button
                    id="botao-comecar"
                    class="botao-comecar"
                    type="button"
                >
                    Começar

                    <span class="seta" aria-hidden="true">
                        →
                    </span>
                </button>

            </div>

        </section>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
