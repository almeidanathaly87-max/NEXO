<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo - Criar conta</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="auth-page">
        <div class="shape shape-purple"></div>
        <div class="shape shape-orange"></div>
        <div class="shape shape-pink"></div>

        <section class="login-card">
            <div class="brand small">
                <div class="brand-icon">✦</div>
                <div class="brand-name">nexo</div>
            </div>

            <h1>Criar conta</h1>
            <p class="subtitle">Comece criando sua conta principal.</p>

            <form id="cadastroForm">
                <div class="input-box">
                    <span>✉</span>
                    <input id="email" type="text" placeholder="E-mail ou usuário" autocomplete="username">
                </div>

                <div class="input-box">
                    <span>♙</span>
                    <input id="senha" type="password" placeholder="Senha" autocomplete="new-password">
                </div>

                <div class="input-box">
                    <span>♙</span>
                    <input id="confirmacao" type="password" placeholder="Confirmar senha" autocomplete="new-password">
                </div>

                <button class="primary-button" type="submit">Criar conta</button>
            </form>

            <a class="back-link" href="index.html">Voltar para o login</a>
        </section>
    </main>

    <script src="js/cadastro.js"></script>
</body>
</html>
